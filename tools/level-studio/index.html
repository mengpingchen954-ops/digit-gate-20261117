<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>数字门 · 关卡工作台</title><link rel="stylesheet" href="/style.css"></head>
<body>
<header><div class="brand"><span class="brand-mark">门</span><div><strong>数字门 <span class="dim">/ 关卡工作台</span></strong><small id="project">连接项目…</small></div></div><div class="header-actions"><span id="dirty" class="pill">已载入</span><button id="undo">撤销</button><button id="reload">重新读取</button><button id="apply" class="primary">应用到游戏</button></div></header>
<div class="workspace">
<aside class="sidebar"><div class="eyebrow">编辑内容</div><nav id="tabs"><button data-tab="overview" class="active">◎　关卡总览</button><button data-tab="scenery">▱　场景道路与护栏</button><button data-tab="gates">＋　右侧变量门与路线</button><button data-tab="rewards">◇　左侧变量门与奖励</button><button data-tab="obstacles">▣　障碍物与路线</button><button data-tab="enemies">◉　丧尸生成区域</button><button data-tab="squad">♟　我方队伍</button><button data-tab="bosses">♜　开场 Boss</button></nav>
<button class="death-nav" data-tab="death" id="deathTab">▷　死亡动画与表现</button>
<button class="death-nav" data-tab="models" id="modelsTab">↥　导入与替换丧尸</button>
<div class="sidebar-bottom"><div class="eyebrow">关卡方案</div><select id="presets" aria-label="已保存的方案"><option value="">选择已保存方案</option></select><button id="loadPreset" class="full">载入所选方案</button><div class="inline"><input id="presetName" placeholder="例如：第二关 · 弯曲奖励路" aria-label="新方案名称"><button id="savePreset">另存</button></div><button id="export" class="full subtle">导出配置 JSON</button><label class="import-label">导入配置 JSON<input id="import" type="file" accept=".json" hidden></label><p class="tip">先另存方案，再应用到游戏。应用前的配置会自动备份。</p></div></aside>
<main><div class="canvas-top"><div><h1 id="viewTitle">关卡总览</h1><p id="viewHint">俯视布局 · 上方是远处，下方是我方</p></div><div class="legend"><span class="blue">● 变量门</span><span class="gold">● 奖励</span><span class="red">● 障碍</span><span class="green">● 丧尸</span></div></div>
<div class="canvas-wrap"><canvas id="map" aria-label="关卡俯视编辑画布"></canvas><div class="canvas-note">实景几何俯视图 · 不模拟射击或击杀</div><div class="canvas-modes" role="group" aria-label="画布操作模式"><button id="panView" aria-pressed="true" title="左键拖拽只移动视角，不修改布局">平移视图</button><button id="editLayout" aria-pressed="false" title="拖动路线编号点；地图请在 Creator 拼接">编辑布局</button></div><div class="canvas-controls"><label><input id="fullSquad" type="checkbox" checked>显示满编</label><button id="zoomIn" title="围绕画布中心放大">＋</button><span id="zoomText" aria-label="缩放比例">100%</span><button id="zoomOut" title="围绕画布中心缩小">−</button><button id="fit" title="重置缩放和平移，回到全图">适配</button></div></div>
<div class="scene-status"><span id="mapStatus">正在连接 Creator 真实场景…</span><button id="refreshMap">刷新地图</button><label><input id="showPlane" type="checkbox" checked>显示右侧障碍物</label></div>
<div class="timeline"><button id="play">▶ 预览</button><strong id="timeText">0.0 s</strong><input id="time" aria-label="预览时间" type="range" min="0" max="100" step="0.1" value="0"><button id="resetTime">回到开场</button></div>
<div class="metrics" id="metrics"></div><div id="status" role="status">准备就绪</div></main>
<aside class="inspector"><div class="eyebrow">属性与操作</div><div id="panel"></div></aside>
</div><dialog id="notice"><form method="dialog"><h2 id="noticeTitle"></h2><p id="noticeText"></p><button class="primary">知道了</button></form></dialog><script type="module" src="/app.js"></script></body></html>
